name: Test formula
on:
  push:
    paths: ['Formula/**', 'scripts/**', 'tests/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formula-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tests
  install:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_CURL_RETRIES: '1'
        run: |
          printf 'connect-timeout = 15\nmax-time = 90\n' > "$RUNNER_TEMP/themis-curlrc"
          export HOMEBREW_CURLRC="$RUNNER_TEMP/themis-curlrc"
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap danielgrbacbravo/themis
          brew install --build-from-source danielgrbacbravo/themis/themis
          brew test danielgrbacbravo/themis/themis
