name: Test formula
on:
  push:
    paths: ['Formula/**', 'scripts/**', 'tests/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formula-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tests
  install:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache verified source for Linux
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          python3 - <<'PYTHON'
          import hashlib, os, pathlib, re, shutil, subprocess
          formula = pathlib.Path("Formula/themis.rb").read_text()
          url = re.search(r'^  url "([^"\n]+)"$', formula, re.M)[1]
          version = re.search(r'^  version "([0-9.]+)"$', formula, re.M)[1]
          expected = re.search(r'^  sha256 "([0-9a-f]{64})"$', formula, re.M)[1]
          name = f"themis_{version}_source.tar.gz"
          assert url == f"https://github.com/danielgrbacbravo/themis/releases/download/v{version}/{name}"
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / name
          subprocess.run(["gh", "release", "download", f"v{version}", "--repo", "danielgrbacbravo/themis", "--pattern", name, "--output", str(archive)], check=True, timeout=120)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, "Source checksum mismatch"
          cache = pathlib.Path(subprocess.check_output(["brew", "--cache"], text=True).strip()) / "downloads"
          cache.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(archive, cache / (hashlib.sha256(url.encode()).hexdigest() + "--" + name))
          print("Cached the checksum-verified source; Homebrew will verify it again on installation.")
          PYTHON
      - name: Install and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ASK: '1'
          HOMEBREW_CURL_RETRIES: '1'
        run: |
          printf 'connect-timeout = 15\nmax-time = 90\n' > "$RUNNER_TEMP/themis-curlrc"
          export HOMEBREW_CURLRC="$RUNNER_TEMP/themis-curlrc"
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap danielgrbacbravo/themis
          brew install --build-from-source danielgrbacbravo/themis/themis
          brew test danielgrbacbravo/themis/themis
