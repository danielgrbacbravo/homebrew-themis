name: Update formula
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: formula-update
  cancel-in-progress: false
jobs:
  update:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tests
      - name: Update from the latest verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update.py
      - name: Commit updated formula
        run: |
          if ! git diff --quiet -- Formula/themis.rb; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Formula/themis.rb
            git commit -m 'chore: updated themis release'
            git push
          fi
